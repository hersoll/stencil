[package]
name = "app"
version = "0.1.0"
authors = ["Herman <herman.sollerman@gmail.com>"]
edition = "2024"

[dependencies]
# Shared dependencies (used by both client and server)
dioxus = { version = "0.6.0", features = ["fullstack", "router"] }
macros = { path = "./macros" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
derive_more = { version = "2.0.1", features = ["from"] }
num-traits = "0.2.19"

# Web-only dependencies (optional, enabled by web feature)
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
gloo = { version = "0.11.0", features = ["file"], optional = true }
web-sys = { version = "0.3.77", features = ["Window", "Document", "HtmlAnchorElement", "Url"], optional = true }
js-sys = { version = "0.3.77", optional = true }

# Server-only dependencies (optional, enabled by server feature)
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"], optional = true }
tokio = { version = "1.46.1", features = ["full", "macros"], optional = true }
dotenv = { version = "0.15.0", optional = true }
rand = { version = "0.9.1", optional = true }
ctor = {version = "0.4.2", optional = true}

# Dependencies that need different handling
once_cell = "1.21.3"  # Can be used on both, but consider std::sync::OnceLock for newer Rust
tracing-subscriber = "0.3.19"

# Target-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3.3"

[features]
default = []  # No default features to avoid conflicts
web = [
    "dioxus/web", 
    "dep:wasm-bindgen", 
    "dep:wasm-bindgen-futures",
    "dep:gloo",
    "dep:web-sys", 
    "dep:js-sys",
]
server = [
    "dioxus/server", 
    "dep:tokio", 
    "dep:sqlx", 
    "dep:dotenv",
    "dep:ctor",
    "dep:rand" ]
desktop = ["dioxus/desktop"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[package.metadata.rust-analyzer]
features = ["server", "web", "desktop"]
